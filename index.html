<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwiftType Pro | Elite Typing</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #05070a;
            --surface: #11141b;
            --primary: #00f2fe;
            --secondary: #7000ff;
            --text-main: #e6edf3;
            --text-dim: #4b5563;
            --accent-glow: rgba(0, 242, 254, 0.15);
            --correct: #4ade80;
            --wrong: #f87171;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* --- DEVICE MOCKUP ELEMENTS --- */
        .app-window {
            background: var(--surface);
            width: 95%;
            max-width: 900px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8);
            position: relative;
            overflow: hidden;
        }

        .status-bar {
            background: rgba(0,0,0,0.2);
            padding: 8px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: var(--text-dim);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .status-icons i { margin-left: 12px; color: var(--text-dim); }

        /* --- APP CONTENT --- */
        .content { padding: 3rem; }

        .nav-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .difficulty-picker {
            display: flex;
            gap: 10px;
            background: #000;
            padding: 5px;
            border-radius: 12px;
        }

        .diff-btn {
            padding: 6px 16px;
            border: none;
            background: transparent;
            color: var(--text-dim);
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            transition: 0.3s;
        }

        .diff-btn.active {
            background: var(--secondary);
            color: white;
            box-shadow: 0 0 15px rgba(112, 0, 255, 0.4);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .stat-item .label {
            display: block;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-dim);
            margin-bottom: 5px;
        }

        .stat-item .value {
            font-size: 2.5rem;
            font-weight: 800;
            font-family: 'JetBrains Mono', monospace;
            background: linear-gradient(to right, var(--primary), #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* --- TYPING AREA --- */
        #display-text {
            font-size: 1.6rem;
            line-height: 1.5;
            color: var(--text-dim);
            position: relative;
            margin-bottom: 2rem;
            user-select: none;
            min-height: 120px;
        }

        .char { position: relative; transition: 0.1s; }
        .char.correct { color: var(--text-main); }
        .char.incorrect { color: var(--wrong); border-bottom: 2px solid var(--wrong); }
        
        .cursor {
            position: absolute;
            width: 2px;
            height: 1.6rem;
            background: var(--primary);
            animation: blink 1s infinite;
            box-shadow: 0 0 10px var(--primary);
        }

        @keyframes blink { 50% { opacity: 0; } }

        #hidden-input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        .btn-restart {
            background: transparent;
            border: 1px solid var(--text-dim);
            color: var(--text-dim);
            padding: 10px 24px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: 600;
        }

        .btn-restart:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--accent-glow);
        }

        .focus-notice {
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-dim);
            margin-top: 1rem;
            opacity: 0.6;
        }
    </style>
</head>
<body>

<div class="app-window">
    <div class="status-bar">
        <div class="time-now">23:42</div>
        <div class="status-icons">
            <i class="fas fa-wifi"></i>
            <i class="fas fa-signal"></i>
            <i class="fas fa-battery-three-quarters"></i>
        </div>
    </div>

    <div class="content">
        <div class="nav-controls">
            <div class="difficulty-picker">
                <button class="diff-btn active" onclick="setDiff('easy', this)">EASY</button>
                <button class="diff-btn" onclick="setDiff('med', this)">MEDIUM</button>
                <button class="diff-btn" onclick="setDiff('hard', this)">HARD</button>
            </div>
            <button class="btn-restart" id="reset-btn">
                <i class="fas fa-redo"></i> Reset
            </button>
        </div>

        <div class="stats-grid">
            <div class="stat-item">
                <span class="label">Speed</span>
                <span class="value" id="wpm">00</span>
            </div>
            <div class="stat-item">
                <span class="label">Accuracy</span>
                <span class="value" id="accuracy">100%</span>
            </div>
            <div class="stat-item">
                <span class="label">Seconds</span>
                <span class="value" id="timer">30</span>
            </div>
        </div>

        <div id="display-text">
            <div class="cursor" id="cursor"></div>
            <div id="words-container"></div>
        </div>
        
        <input type="text" id="hidden-input" autofocus>
        
        <div class="focus-notice">Click anywhere to focus and start typing</div>
    </div>
</div>

<script>
    const data = {
        easy: ["The cat sat on the mat.", "Sunlight is warm.", "I like to code apps.",




In an era of constant digital stimulation, we have mistakenly come to view boredom as an enemy to be defeated. However, true creativity often flourishes in the quiet gaps between tasks. When we put down our phones and allow our minds to wander without a destination, we give our brains the space to make unexpected connections and solve complex problems. Embracing a little bit of "nothing" isn't a waste of time; it is a vital reset for the modern mind., "Trees are very green."],
        med: ["Success is not final, failure is not fatal: it is the courage to continue.", "Intelligence is the ability to adapt to change."],
        hard: ["const api_key = '0x74f2'; // Secure connection required @100%", "System.out.println(Math.sqrt(256)); // Logic error?"]
    };

    let currentDiff = 'easy';
    let timer = null;
    let timeLeft = 30;
    let isStarted = false;
    let charIndex = 0;
    let mistakes = 0;

    const wordsContainer = document.getElementById('words-container');
    const hiddenInput = document.getElementById('hidden-input');
    const cursor = document.getElementById('cursor');

    function init() {
        const quote = data[currentDiff][Math.floor(Math.random() * data[currentDiff].length)];
        wordsContainer.innerHTML = quote.split('').map(char => `<span class="char">${char}</span>`).join('');
        charIndex = 0;
        mistakes = 0;
        timeLeft = 30;
        isStarted = false;
        clearInterval(timer);
        updateCursor();
        document.getElementById('timer').innerText = timeLeft;
        document.getElementById('wpm').innerText = "00";
        document.getElementById('accuracy').innerText = "100%";
        hiddenInput.value = "";
        hiddenInput.disabled = false;
    }

    function setDiff(d, btn) {
        currentDiff = d;
        document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        init();
    }

    function updateCursor() {
        const charSpans = document.querySelectorAll('.char');
        if(charIndex < charSpans.length) {
            const span = charSpans[charIndex];
            cursor.style.left = span.offsetLeft + "px";
            cursor.style.top = span.offsetTop + "px";
        }
    }

    hiddenInput.addEventListener('input', (e) => {
        if(!isStarted) startTimer();
        
        const chars = document.querySelectorAll('.char');
        const typed = hiddenInput.value.split('');
        charIndex = typed.length;

        chars.forEach((span, i) => {
            const char = typed[i];
            if (char == null) {
                span.className = 'char';
            } else if (char === span.innerText) {
                span.className = 'char correct';
            } else {
                span.className = 'char incorrect';
            }
        });

        // Accuracy
        mistakes = document.querySelectorAll('.incorrect').length;
        let acc = Math.round(((charIndex - mistakes) / charIndex) * 100);
        document.getElementById('accuracy').innerText = (acc >= 0 ? acc : 100) + "%";

        updateCursor();
        if(charIndex === chars.length) finish();
    });

    function startTimer() {
        isStarted = true;
        timer = setInterval(() => {
            if(timeLeft > 0) {
                timeLeft--;
                document.getElementById('timer').innerText = timeLeft;
                // WPM
                const wpm = Math.round(((charIndex - mistakes) / 5) / ((30 - timeLeft) / 60));
                document.getElementById('wpm').innerText = wpm > 0 ? wpm.toString().padStart(2, '0') : "00";
            } else {
                finish();
            }
        }, 1000);
    }

    function finish() {
        clearInterval(timer);
        hiddenInput.disabled = true;
        cursor.style.display = 'none';
    }

    document.addEventListener('click', () => hiddenInput.focus());
    document.getElementById('reset-btn').addEventListener('click', () => {
        cursor.style.display = 'block';
        init();
    });

    // Clock
    setInterval(() => {
        const now = new Date();
        document.querySelector('.time-now').innerText = now.getHours() + ":" + now.getMinutes().toString().padStart(2, '0');
    }, 1000);

    init();
</script>

</body>
</html>
